# Canlı sunucudaki Köprü aktarımını (posta kutusu + dosya) dener. tests/sunucu değişince ya da elle.
name: Sunucu testi
on:
  workflow_dispatch:
  push:
    paths: ['tests/sunucu/**', '.github/workflows/sunucu-testi.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/sunucu/aktarim.mjs
  istemci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tool/relay_check.dart
