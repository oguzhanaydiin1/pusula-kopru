name: pusula_kopru
description: Pusula Köprü — bilgisayar ile telefon arasında dosya, bağlantı ve pano paylaşımı (OA Labs).
publish_to: 'none'
version: 0.7.0+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  pointycastle: '>=3.9.1 <5.0.0'
  http: ^1.2.2
  file_picker: ^8.1.7
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  desktop_drop: '>=0.4.4 <1.0.0'
  path_provider: ^2.1.5
  window_manager: ^0.5.1
  tray_manager: ^0.5.0
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/tray.ico
